<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bookish — Espace laptop</title>
<link rel="icon" href="../app/icons/icon-192.png">
<link rel="stylesheet" href="../app/css/app.css">
<style>
  .laptop-shell { max-width: 1400px; margin: 0 auto; padding: 22px 22px 60px; }
  .laptop-head { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; flex-wrap: wrap; }
  .laptop-head h1 { font-size: 1.45rem; }
  .laptop-grid { display: grid; grid-template-columns: 320px 1fr; gap: 18px; align-items: start; }
  @media (max-width: 1000px) { .laptop-grid { grid-template-columns: 1fr; } }

  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 16px; flex-wrap: wrap; }
  .tab {
    appearance: none; border: 0; background: transparent; color: var(--muted);
    padding: 10px 14px; font-size: .9rem; font-weight: 600; cursor: pointer;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
    transition: color .16s var(--ease), border-color .16s var(--ease);
  }
  .tab:hover { color: var(--ink); }
  .tab[aria-selected="true"] { color: var(--primary); border-bottom-color: var(--primary); }

  .table-wrap { overflow: auto; max-height: 70vh; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
  table.data { width: 100%; border-collapse: collapse; font-size: .85rem; }
  table.data th {
    position: sticky; top: 0; z-index: 2; background: var(--surface-2);
    text-align: left; padding: 9px 11px; font-size: .74rem; text-transform: uppercase;
    letter-spacing: .05em; color: var(--muted); border-bottom: 1px solid var(--line-strong);
    cursor: pointer; white-space: nowrap;
  }
  table.data th:hover { color: var(--ink); }
  table.data td { padding: 8px 11px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.data tr:hover td { background: var(--surface-2); }
  table.data td.num { text-align: right; font-variant-numeric: tabular-nums; }

  .tree { display: flex; flex-direction: column; gap: 2px; }
  .tree__group { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); margin-bottom: 8px; overflow: hidden; }
  .tree__head {
    display: flex; align-items: center; gap: 10px; padding: 11px 13px; cursor: pointer;
    background: var(--surface-2); font-weight: 600;
  }
  .tree__head:hover { background: var(--surface-3); }
  .tree__count { margin-left: auto; font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .tree__body { padding: 6px 13px 10px; }
  .tree__body .book-row { margin-bottom: 6px; }

  .status-pill {
    display: inline-flex; align-items: center; gap: 6px; font-size: .76rem; font-weight: 600;
    padding: 4px 10px; border-radius: 999px; background: var(--surface-3); color: var(--muted);
  }
  .status-pill.is-ok { background: var(--ok-soft); color: var(--ok); }
  .status-pill.is-err { background: var(--danger-soft); color: var(--danger); }
</style>
</head>
<body>
<div class="laptop-shell">
  <header class="laptop-head">
    <div class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
      </svg>
    </div>
    <div class="grow">
      <h1>Bookish — Espace laptop</h1>
      <p class="small muted" style="margin:2px 0 0">Récupérez l'inventaire depuis Google Drive, classez, analysez et exportez.</p>
    </div>
    <span class="status-pill" id="status">Non connecté</span>
  </header>

  <div class="laptop-grid">
    <aside>
      <div class="card card--pad" style="margin-bottom:14px">
        <div class="section__title">Google Drive</div>
        <label class="field">
          <span class="field__label">ID client OAuth</span>
          <input class="input" id="client-id" type="text" placeholder="123…apps.googleusercontent.com" autocomplete="off">
          <span class="field__hint">Le même ID client que dans l'application mobile (accès <code>drive.file</code>).</span>
        </label>
        <div class="row" style="gap:8px; flex-wrap:wrap">
          <button class="btn btn--primary btn--sm" id="btn-connect">Se connecter</button>
          <button class="btn btn--secondary btn--sm" id="btn-pull">Actualiser</button>
          <label class="row tiny muted" style="gap:6px; cursor:pointer">
            <input type="checkbox" id="auto-refresh"> Auto (5 min)
          </label>
        </div>
      </div>

      <div class="card card--pad" style="margin-bottom:14px">
        <div class="section__title">Fichier local</div>
        <input type="file" id="file-json" accept="application/json,.json" class="input" style="margin-bottom:8px">
        <button class="btn btn--secondary btn--sm btn--block" id="btn-load-local">Charger un .json</button>
        <p class="tiny muted" style="margin-top:8px">Permet de travailler hors ligne sur un export de l'application.</p>
      </div>

      <div class="card card--pad">
        <div class="section__title">Fichiers sur Drive</div>
        <div id="drive-files" class="tiny muted">—</div>
      </div>
    </aside>

    <main>
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-tab="table" aria-selected="true">Tableau</button>
        <button class="tab" role="tab" data-tab="groups" aria-selected="false">Classification</button>
        <button class="tab" role="tab" data-tab="quality" aria-selected="false">Données manquantes</button>
        <button class="tab" role="tab" data-tab="stats" aria-selected="false">Statistiques</button>
      </div>

      <section id="tab-table">
        <div class="card card--pad" style="margin-bottom:12px">
          <div class="row" style="gap:8px; flex-wrap:wrap">
            <div class="searchbar grow" style="min-width:220px">
              <svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
              <input class="input" id="q" type="search" placeholder="Titre, auteur, ISBN, étiquette, pièce…">
            </div>
            <select class="select" id="filter-room" style="width:auto"><option value="">Toutes les pièces</option></select>
            <select class="select" id="filter-tag" style="width:auto"><option value="">Toutes les étiquettes</option></select>
            <button class="btn btn--secondary btn--sm" id="btn-export-xlsx">Exporter .xlsx</button>
            <button class="btn btn--secondary btn--sm" id="btn-export-csv">Exporter .csv</button>
          </div>
          <div class="small muted" id="table-count" style="margin-top:8px">—</div>
        </div>
        <div class="table-wrap"><table class="data" id="table"></table></div>
      </section>

      <section id="tab-groups" class="hidden">
        <div class="card card--pad" style="margin-bottom:12px">
          <div class="row" style="gap:8px; flex-wrap:wrap">
            <span class="small muted">Classer par</span>
            <select class="select" id="group-by" style="width:auto">
              <option value="room">Pièce</option>
              <option value="shelf">Étagère</option>
              <option value="tag">Étiquette</option>
              <option value="author">Auteur</option>
              <option value="publisher">Éditeur</option>
              <option value="year">Année</option>
              <option value="language">Langue</option>
              <option value="rating">Note</option>
              <option value="source">Source</option>
            </select>
            <label class="row tiny muted" style="gap:6px; cursor:pointer">
              <input type="checkbox" id="group-desc"> Tri décroissant
            </label>
          </div>
        </div>
        <div class="tree" id="groups"></div>
      </section>

      <section id="tab-quality" class="hidden">
        <div id="quality"></div>
      </section>

      <section id="tab-stats" class="hidden">
        <div class="two-col" id="stats-charts"></div>
      </section>
    </main>
  </div>
</div>

<script type="module" src="laptop.js"></script>
</body>
</html>
